<!DOCTYPE html>
<html>
<head>
<title>Travel Chatbot</title>

<style>
body{
font-family:Arial;
}

.chat{
position:fixed;
bottom:20px;
right:20px;
border:1px solid black;
padding:10px;
width:250px;
background:white;
}

#chat{
height:150px;
overflow:auto;
}
</style>

</head>

<body>

<h1>Dream Travels</h1>

<p>Book flights and hotels at low prices.</p>

<div class="chat">

<h3>Travel Bot</h3>

<div id="chat"></div>

<input id="msg">

<button onclick="reply()">Send</button>

</div>

<script>

function reply(){

m=msg.value.toLowerCase()

r="Sorry"

if(m=="hi")
r="Hello"

else if(m=="goa")
r="Goa package available"

else if(m=="flight")
r="Flights available"

chat.innerHTML+="You: "+m+"<br>"
chat.innerHTML+="Bot: "+r+"<br><br>"

msg.value=""

}

</script>

</body>
</html>
